name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 配置
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release --parallel

      - name: 测试
        run: ctest --test-dir build --output-on-failure -C Release

      - name: 冒烟测试
        shell: bash
        run: |
          exe=$(find build -type f \( -name csp -o -name csp.exe \) | head -1)
          "$exe" -t 1 -d 2026-10-19-8-25-0 --no-color | head -5
